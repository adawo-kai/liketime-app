spring:
  application:
    name: liketime
  # Локальные секреты (логин/пароль БД, ключи) лежат в application-local.properties и не попадают в git.
  # В разработке файл берётся из src/main/resources, на сервере из папки config рядом с jar.
  config:
    import: optional:classpath:application-local.properties,optional:file:./config/application-local.properties
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      # Схему ведёт только Flyway, Hibernate лишь проверяет соответствие сущностей
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Все даты в БД хранятся в UTC
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
